name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest --parallel --build-cache

    - name: Run lint
      run: ./gradlew lintDebug --parallel --build-cache

    - name: Build debug and release APKs
      run: ./gradlew assembleDebug assembleRelease --parallel --build-cache

    - name: Generate Manifest and Post Feedback
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const crypto = require('crypto');
          const path = require('path');
          
          const getAllFiles = (dirPath, arrayOfFiles) => {
            const files = fs.readdirSync(dirPath);
            arrayOfFiles = arrayOfFiles || [];
            files.forEach(file => {
              const fullPath = path.join(dirPath, file);
              if (fs.statSync(fullPath).isDirectory()) {
                arrayOfFiles = getAllFiles(fullPath, arrayOfFiles);
              } else {
                if (file.endsWith('.apk')) {
                  arrayOfFiles.push(fullPath);
                }
              }
            });
            return arrayOfFiles;
          };
          
          const files = getAllFiles('app/build/outputs/apk');
          
          let tableRows = [];
          
          for (const file of files) {
            const hash = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            const fileName = path.basename(file);
            const versionMatch = fileName.match(/v([0-9]+\.[0-9]+\.[0-9]+)/);
            const version = versionMatch ? versionMatch[1] : 'unknown';
            
            tableRows.push([fileName, version, 'Success', `\`${hash.substring(0, 10)}...\``]);
          }
          
          const tableHeader = ['Artifact', 'Version', 'Status', 'SHA256'];
          
          const { owner, repo } = context.repo;
          const artifactsUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}/artifacts`;
          
          // CI Action Summary
          core.summary
            .addHeading('Build Manifest')
            .addTable([tableHeader, ...tableRows])
            .addLink('View Artifacts', artifactsUrl)
            .write();
          
          // PR Comment
          const body = '## Build Manifest\n\n' + 
            '| ' + tableHeader.join(' | ') + ' |\n' +
            '| ' + tableHeader.map(() => ':---').join(' | ') + ' |\n' +
            tableRows.map(row => '| ' + row.join(' | ') + ' |').join('\n') + 
            '\n\n[View Artifacts](' + artifactsUrl + ')';
            
          await github.rest.issues.createComment({
            owner,
            repo,
            issue_number: context.issue.number,
            body: body
          });

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/MosqueDND-debug-v*.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/MosqueDND-release-v*.apk
