name: Release APK & SHA256SUMS

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Keystore Properties
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEYSTORE" || -z "$SIGNING_KEYSTORE_PASSWORD" || -z "$SIGNING_KEY_PASSWORD" || -z "$SIGNING_KEY_ALIAS" ]]; then
            echo "::error::Release signing secrets are not configured."
            exit 1
          fi
          printf 'storePassword=%s\n' "$SIGNING_KEYSTORE_PASSWORD" >> app/keystore.properties
          printf 'keyPassword=%s\n' "$SIGNING_KEY_PASSWORD" >> app/keystore.properties
          printf 'keyAlias=%s\n' "$SIGNING_KEY_ALIAS" >> app/keystore.properties
          printf 'storeFile=%s\n' "${GITHUB_WORKSPACE}/app/keystore.jks" >> app/keystore.properties
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > app/keystore.jks

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug/Release APK and AAB
        env:
          RELEASE_SIGNING_REQUIRED: "true"
        run: ./gradlew assembleDebug assembleRelease bundleRelease

      - name: Prepare Release Artifacts and Notes
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/MosqueDND-debug-v*.apk release_assets/
          cp app/build/outputs/apk/release/MosqueDND-release-v*.apk release_assets/
          cp app/build/outputs/bundle/release/app-release.aab release_assets/
          
          # Generate SHA256SUMS for all release artifacts
          cd release_assets
          sha256sum * > SHA256SUMS
          
          # Construct release notes body with table
          echo "## Release Artifacts" > ../RELEASE_BODY.md
          echo "| Artifact | SHA256 |" >> ../RELEASE_BODY.md
          echo "| :--- | :--- |" >> ../RELEASE_BODY.md
          while read -r line; do
            sha=$(echo $line | cut -d' ' -f1)
            file=$(echo $line | cut -d' ' -f2)
            echo "| $file | \`$sha\` |" >> ../RELEASE_BODY.md
          done < SHA256SUMS

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/*
          body_path: RELEASE_BODY.md
          generate_release_notes: true
